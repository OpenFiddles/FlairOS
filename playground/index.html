<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MixieLang Playground</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
textarea { width: 100%; height: 14rem; font-family: ui-monospace, monospace; box-sizing: border-box; }
button { margin-top: .5rem; padding: .5rem 1.2rem; }
pre { background: #f4f4f4; padding: 1rem; min-height: 4rem; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>MixieLang Playground</h1>
<p>Runs the MixieLang interpreter compiled to WebAssembly. Everything happens in your browser.</p>
<textarea id="src" aria-label="MixieLang source">print "Hello, World!";</textarea>
<button id="run" type="button">Run</button>
<h2>Output</h2>
<pre id="out" aria-live="polite"></pre>
<script src="mixie.js"></script>
<script>
document.getElementById('run').addEventListener('click', async () => {
  const out = document.getElementById('out');
  out.textContent = '';
  const append = (t) => { out.textContent += t + '\n'; };
  const mod = await createMixie({ print: append, printErr: append });
  mod.FS.writeFile('/input.mx', document.getElementById('src').value);
  try { mod.callMain(['-f', '/input.mx']); } catch (e) { if (!(e && e.name === 'ExitStatus')) append(String(e)); }
});
</script>
</body>
</html>
