stages: [check, test, build]

default:
  image: rust:1.85
variables:
  CARGO_TERM_COLOR: always
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
cache:
  key: "cargo-$CI_COMMIT_REF_SLUG"
  paths:
    - .cargo/registry/
    - .cargo/git/
    - target/

clippy:
  stage: check
  script:
    - rustup component add clippy
    - cargo clippy --all-targets --all-features -- -D warnings

test:
  stage: test
  script:
    - cargo test --all-targets

build-linux:
  stage: build
  script:
    - cargo build --release
    - mkdir -p dist/linux
    - cp target/release/mixie dist/linux/mixie
  artifacts:
    paths: [dist/linux/]
    expire_in: 1 week

build-windows:
  stage: build
  script:
    - apt-get update -qq
    - apt-get install -y -qq gcc-mingw-w64-x86-64
    - rustup target add x86_64-pc-windows-gnu
    - cargo build --release --target x86_64-pc-windows-gnu
    - mkdir -p dist/windows
    - cp target/x86_64-pc-windows-gnu/release/mixie.exe dist/windows/mixie.exe
  artifacts:
    paths: [dist/windows/]
    expire_in: 1 week
