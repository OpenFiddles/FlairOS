name: Developer Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: MkDocs Material + Doxygen
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install documentation toolchain
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq doxygen python3 python3-venv > /dev/null

      - name: Build Doxygen API reference
        run: |
          mkdir -p build/doxygen docs/api
          doxygen Doxyfile
          cp -a build/doxygen/html/. docs/api/

      - name: Build MkDocs site
        run: |
          python3 -m venv /tmp/mkdocs-venv
          /tmp/mkdocs-venv/bin/python -m pip install --disable-pip-version-check mkdocs-material
          /tmp/mkdocs-venv/bin/mkdocs build --strict --site-dir public

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: flairOS-developer-docs
          path: public
          if-no-files-found: error
          retention-days: 14
