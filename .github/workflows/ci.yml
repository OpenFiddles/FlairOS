name: FlairOS Linux CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    name: Build debug and release i386 images
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out FlairOS
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential gcc-i686-linux-gnu libc6-dev-i386-cross \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            autoconf automake autopoint gettext libtool texinfo pkg-config \
            mtools dosfstools parted e2fsprogs cpio qemu-system-x86 \
            python3 git grub-common ccache > /dev/null

      - name: Restore compiler and incremental build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            build-out/work-shared/src
            build-out/work-shared/tools/grub
            build-out/work-debug/src
            build-out/work-release/src
          key: ${{ runner.os }}-flairos-linux-foundation-${{ hashFiles('build/build-linux-image.sh') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-flairos-linux-foundation-${{ hashFiles('build/build-linux-image.sh') }}-
            ${{ runner.os }}-flairos-linux-foundation-

      - name: Show compiler cache status
        run: ccache --show-stats

      - name: Validate AirP package manager
        run: sh tests/airp-package-test.sh

      - name: Build debug and release images
        run: |
          bash build/build-linux-image.sh debug
          bash build/build-linux-image.sh release

      - name: Boot debug image in QEMU
        shell: bash
        run: |
          set +e
          timeout 35s qemu-system-i386 -m 256M \
            -drive file=build-out/flairos-i386-debug.img,format=raw,if=ide \
            -boot c -serial stdio -display none -monitor none -no-reboot \
            > qemu-debug.log 2>&1
          result=$?
          set -e
          cat qemu-debug.log
          grep -q "FlairOS userspace ready" qemu-debug.log
          echo "QEMU exited with $result after the debug boot marker (timeout is expected)."

      - name: Boot release image in QEMU
        shell: bash
        run: |
          set +e
          timeout 35s qemu-system-i386 -m 256M \
            -drive file=build-out/flairos-i386-release.img,format=raw,if=ide \
            -boot c -serial stdio -display none -monitor none -no-reboot \
            > qemu-release.log 2>&1
          result=$?
          set -e
          cat qemu-release.log
          grep -q "FlairOS userspace ready" qemu-release.log
          echo "QEMU exited with $result after the release boot marker (timeout is expected)."

      - name: Upload debug bootable image
        uses: actions/upload-artifact@v4
        with:
          name: flairos-i386-debug
          path: build-out/flairos-i386-debug.img
          if-no-files-found: error
          retention-days: 14

      - name: Upload release bootable image
        uses: actions/upload-artifact@v4
        with:
          name: flairos-i386-release
          path: build-out/flairos-i386-release.img
          if-no-files-found: error
          retention-days: 14

      - name: Upload boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flairos-i386-boot-diagnostics
          path: |
            qemu-debug.log
            qemu-release.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Show final compiler cache statistics
        if: always()
        run: ccache --show-stats
