name: FlairOS Linux CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build bootable i386 image (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    steps:
      - name: Check out FlairOS
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential gcc-i686-linux-gnu libc6-dev-i386-cross \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            autoconf automake autopoint gettext libtool texinfo pkg-config \
            mtools dosfstools parted e2fsprogs cpio qemu-system-x86 \
            python3 git grub-common > /dev/null

      - name: Validate AirP package manager
        run: sh tests/airp-package-test.sh

      - name: Build Linux, GRUB, BusyBox, and disk image
        run: ./build/build-linux-image.sh "${{ matrix.profile }}"

      - name: Boot image in QEMU
        shell: bash
        run: |
          set +e
          timeout 35s qemu-system-i386 -m 256M \
            -drive file=build-out/flairos-i386-${{ matrix.profile }}.img,format=raw,if=ide \
            -boot c -serial stdio -display none -monitor none -no-reboot \
            > qemu-${{ matrix.profile }}.log 2>&1
          result=$?
          set -e
          cat qemu-${{ matrix.profile }}.log
          grep -q "FlairOS userspace ready" qemu-${{ matrix.profile }}.log
          echo "QEMU exited with $result after the boot marker (timeout is expected)."

      - name: Upload bootable image
        uses: actions/upload-artifact@v4
        with:
          name: flairos-i386-${{ matrix.profile }}
          path: build-out/flairos-i386-${{ matrix.profile }}.img
          if-no-files-found: error
          retention-days: 14

      - name: Upload boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flairos-i386-${{ matrix.profile }}-diagnostics
          path: qemu-${{ matrix.profile }}.log
          if-no-files-found: ignore
          retention-days: 7
