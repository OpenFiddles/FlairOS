name: FlairOS CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (i386)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nasm gcc-multilib binutils make python3 qemu-system-x86 > /dev/null

      - name: Architecture guard
        run: |
          make -n ARCH=i386 > /dev/null
          if make -n ARCH=x86_64 > /dev/null 2>&1; then
            echo "x86_64 must be refused until it has a boot layer"
            exit 1
          fi
          if make -n ARCH=arm > /dev/null 2>&1; then
            echo "arm must be refused until it has a boot layer"
            exit 1
          fi

      - name: Build disk image
        run: |
          make ARCH=i386
          test -s build/textile.img

      - name: Build standalone GUI Terminal app
        run: make terminal-app

      - name: Filesystem tests
        run: make fs-test
      - name: Boot layout and AIRP boundary tests
        run: python3 tests/boot_layout_test.py

      - name: Host tests
        run: make test

      - name: Desktop integration test
        run: python3 tests/desktop_test.py build/textile.img

      - name: Upload disk image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flairOS-i386-image
          path: build/textile.img
          if-no-files-found: ignore
          retention-days: 7

  airp-explorer:
    name: Build Explorer AIRP
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gcc-multilib binutils python3 > /dev/null
      - name: Compile and package Explorer
        run: |
          mkdir -p build/airp
          CFLAGS="-m32 -std=gnu99 -ffreestanding -fno-pic -fno-stack-protector -fno-builtin -fno-common -fno-tree-loop-distribute-patterns -fcf-protection=none -fno-asynchronous-unwind-tables -O2 -Wall -Wextra"
          gcc $CFLAGS -c userland/explorer.c -o build/airp/explorer.o
          gcc $CFLAGS -c userland/rt.c -o build/airp/rt.o
          ld -m elf_i386 -nostdlib -T userland/app.ld -o build/airp/explorer.elf build/airp/explorer.o build/airp/rt.o
          objcopy -O binary build/airp/explorer.elf build/airp/explorer.bin
          python3 tools/airpack.py build/airp/explorer.bin build/airp/explorer.airp explorer
      - uses: actions/upload-artifact@v4
        with:
          name: explorer-airp
          path: build/airp/explorer.airp
          if-no-files-found: error
          retention-days: 7

  arm-qemu-hello:
    name: ARM QEMU hello (arm-port only)
    if: github.ref == 'refs/heads/arm-port'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain and QEMU
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu make qemu-system-arm > /dev/null
      - name: Build and boot hello stub
        run: |
          make -C arch/aarch64 CROSS=aarch64-linux-gnu-
          timeout 20 qemu-system-aarch64 -M virt -cpu cortex-a72 -m 128M -nographic -nic none -kernel arch/aarch64/hello.elf > arm-boot.log 2>&1 || true
          cat arm-boot.log
          grep -q "AirOS ARM: hello" arm-boot.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm-boot-log
          path: arm-boot.log
          if-no-files-found: ignore

  cmake-ninja:
    name: CMake + Ninja (non-blocking)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake toolchain
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cmake ninja-build clang lld nasm binutils python3 qemu-system-x86 > /dev/null
      - name: Configure and build
        run: |
          cmake -S . -B build-ninja -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-i686-clang.cmake
          ninja -C build-ninja
          test -s build-ninja/textile.img
          python3 tests/smoke.py build-ninja/textile.img

  pages:
    name: Deploy web emulator to GitHub Pages
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build-test.result == 'success'
    needs: [build-test, micropython-port]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install image and web dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nasm gcc-multilib binutils make seabios vgabios xorriso python3 > /dev/null
          make ARCH=i386
          mkdir -p public/v86 /tmp/v86
          cp web/index.html public/index.html
          cp build/textile.img public/textile-standard.img
          (cd /tmp/v86 && npm install --no-audit --no-fund v86@0.5.472)
          cp /tmp/v86/node_modules/v86/build/libv86.js /tmp/v86/node_modules/v86/build/v86.wasm public/v86/
          cp /usr/share/seabios/bios-256k.bin public/v86/seabios.bin
          cp /usr/share/seabios/vgabios-stdvga.bin public/v86/vgabios.bin
      - name: Download Python-enabled disk when the port passes
        if: needs.micropython-port.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: flareos-micropython-i386
          path: build/python
      - name: Select deployed disk image
        run: |
          if [ -s build/python/textile-python.img ]; then
            cp build/python/textile-python.img public/textile.img
            echo "Deploying Python-enabled FlairOS image"
          else
            cp build/textile.img public/textile.img
            echo "Deploying standard FlairOS image"
          fi
          xorriso -as mkisofs -quiet -b textile.img -o public/textile.iso public/textile.img
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  micropython-port:
    name: Build MicroPython port (experimental)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install i386 toolchain
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nasm gcc-multilib binutils make python3 git qemu-system-x86 > /dev/null

      - name: Fetch and build MicroPython
        run: make python-image

      - name: Report interpreter image size
        run: |
          test -s build/micropython/flareos.bin
          size=$(stat -c %s build/micropython/flareos.bin)
          echo "MicroPython flat image: $size bytes"
          test "$size" -le 131072
          test -s build/micropython/flareos.airp
          test -s build/textile-python.img

      - name: Boot MicroPython and return to desktop
        run: python3 tests/micropython_boot_test.py build/textile-python.img

      - name: Upload MicroPython build
        uses: actions/upload-artifact@v4
        with:
          name: flareos-micropython-i386
          path: |
            build/micropython/flareos.elf
            build/micropython/flareos.bin
            build/micropython/flareos.airp
            build/textile-python.img
          if-no-files-found: error
          retention-days: 7
