name: FlairOS Linux Release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write

concurrency:
  group: flairos-linux-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out the mirrored source
        uses: actions/checkout@v4

      - name: Compute release tag
        id: tag
        run: echo "tag=linux-build-$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Skip an existing build release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        if: steps.check.outputs.exists == 'false'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential gcc-i686-linux-gnu libc6-dev-i386-cross \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            autoconf automake autopoint gettext texinfo pkg-config \
            mtools dosfstools parted e2fsprogs cpio qemu-system-x86 \
            python3 git grub-common > /dev/null

      - name: Validate AirP
        if: steps.check.outputs.exists == 'false'
        run: sh tests/airp-package-test.sh

      - name: Build release image
        if: steps.check.outputs.exists == 'false'
        run: ./build/build-linux-image.sh release

      - name: Verify boot in QEMU
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          set +e
          timeout 35s qemu-system-i386 -m 256M \
            -drive file=build-out/flairos-i386-release.img,format=raw,if=ide \
            -boot c -serial stdio -display none -monitor none -no-reboot > qemu.log 2>&1
          result=$?
          set -e
          cat qemu.log
          grep -q "FlairOS userspace ready" qemu.log
          echo "QEMU exited with $result after the boot marker."

      - name: Publish bootable image
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" build-out/flairos-i386-release.img \
            --target "$GITHUB_SHA" \
            --title "FlairOS Linux $TAG" \
            --notes "Minimal Linux-based FlairOS V2 image. Built from upstream Linux, GNU GRUB, and BusyBox sources. AirP is included."
