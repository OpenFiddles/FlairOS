name: Build and release

# Runs every 2 hours on the GitHub mirror of GitLab main. For each commit without a release, it builds the i386 image, runs the host and QEMU checks, and publishes the image only if they pass.
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out the mirror
        uses: actions/checkout@v4

      - name: Skip commits that already have a release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$(git rev-parse --short=8 HEAD)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the toolchain and QEMU
        if: steps.check.outputs.exists == 'false'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nasm gcc-multilib binutils make qemu-system-x86 python3 > /dev/null
          qemu-system-i386 --version | head -1

      - name: Build the i386 image
        if: steps.check.outputs.exists == 'false'
        run: |
          make ARCH=i386
          test -s build/textile.img

      - name: Host filesystem tests
        if: steps.check.outputs.exists == 'false'
        run: make fs-test

      - name: Boot smoke test in QEMU
        if: steps.check.outputs.exists == 'false'
        run: make test

      - name: Publish the image
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          cp build/textile.img "build/textile-$TAG.img"
          gh release create "$TAG" "build/textile-$TAG.img" \
            --target "$GITHUB_SHA" \
            --title "Build $TAG" \
            --notes "Built from commit $GITHUB_SHA. Passed the host filesystem tests and the QEMU boot smoke test."
