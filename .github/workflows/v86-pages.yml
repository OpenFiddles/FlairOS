name: Build and Launch in v86 (Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-v86:
    name: Build FlairOS + v86 web bundle
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nasm gcc-multilib binutils make python3 xorriso curl > /dev/null

      - name: Build FlairOS boot media
        run: |
          make ARCH=i386 boot-media
          test -s build/livecd.iso
          test -s build/textile.img

      - name: Assemble web + v86 bundle
        run: |
          mkdir -p dist/v86
          cp web/index.html dist/index.html
          cp build/livecd.iso dist/flair-livecd.iso
          cp build/textile.img dist/textile.img
          curl -fsSL -o dist/v86/libv86.js https://copy.sh/v86/build/libv86.js
          curl -fsSL -o dist/v86/v86.wasm https://copy.sh/v86/build/v86.wasm
          curl -fsSL -o dist/v86/seabios.bin https://copy.sh/v86/bios/seabios.bin
          curl -fsSL -o dist/v86/vgabios.bin https://copy.sh/v86/bios/vgabios.bin
          ls -lh dist dist/v86

      - name: Upload v86 bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: flairos-v86-web
          path: dist
          retention-days: 14

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    name: Deploy to GitHub Pages (v86)
    needs: build-v86
    runs-on: ubuntu-22.04
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
