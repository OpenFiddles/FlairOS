name: QEMU smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qemu-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qemu-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Install the toolchain and QEMU
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nasm gcc-multilib binutils make qemu-system-x86 python3 > /dev/null
          qemu-system-i386 --version | head -1

      - name: Build the i386 disk image
        run: |
          make ARCH=i386
          test -s build/textile.img

      - name: Filesystem host tests
        run: make fs-test

      - name: Boot smoke test in QEMU
        run: make test
